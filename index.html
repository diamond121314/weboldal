<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiamondSzia.hu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="watermarked_img_8380271739027152824.jpg" alt="DiamondSzia Logo">
            <span>DIAMONDSZIA.HU</span>
        </div>
        <nav>
            <a href="#">Főoldal</a>
            <a href="#">Projektek</a>
            <a href="#">Elérhetőség</a>
        </nav>
    </header>

    <section class="hero">
        <div class="skin-container">
            <img src="watermarked_img_8380271739027152824.jpg" alt="DiamondSzia Minecraft Head">
        </div>
        <div class="hero-content">
            <div class="subtitle">Üdvözlöm a látogatókat</div>
            <h1>DiamondSzia Portfólió</h1>
            <p class="description">
                Ez az oldal a saját Minecraft skinem stílusában készült, egyedi dizájnnal és projektekkel. <span>Nézz szét a munkáim között!</span>
            </p>
        </div>
    </section>

    <div class="projects">
        <div class="project-card">
            <div class="project-title">DiamondPvP</div>
            <div class="project-status">Aktív</div>
        </div>
        <div class="project-card">
            <div class="project-title">Kingdoms Server</div>
            <div class="project-status">Fejlesztés alatt</div>
        </div>
        <div class="project-card">
            <div class="project-title">Lobby System</div>
            <div class="project-status">Online</div>
        </div>
    </div>

</body>
</html>
